<!DOCTYPE html>
<html>
<head>
	<title>Research Viewer – Tariq Hussain</title>
	<link rel="shortcut icon" href="images/LOGO.jpg">

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1" />

	<link rel="stylesheet" type="text/css" href="default.css">
	<link rel="stylesheet" type="text/css" href="bootstrap2.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

	<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>

	<style>
		body { font-family: Bahnschrift; }

		.pdf-container {
			max-width: 1100px;
			margin: 30px auto 40px;
			padding: 0 20px;
		}

		.pdf-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			flex-wrap: wrap;
			padding: 16px 0 18px;
			border-bottom: 1px solid #d9e7f4;
			margin-bottom: 18px;
		}

		.pdf-title {
			font-size: 1.15rem;
			color: #0d3349;
			margin: 0;
			flex: 1;
			min-width: 240px;
			line-height: 1.4;
		}

		.pdf-subtitle {
			font-family: 'Bahnschrift Light', monospace;
			font-size: 11px;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #6b7c93;
			margin-bottom: 4px;
		}

		.pdf-actions {
			display: flex;
			gap: 8px;
			flex-shrink: 0;
		}

		.pdf-frame-wrapper {
			position: relative;
			width: 100%;
			height: 82vh;
			min-height: 500px;
			border: 1px solid #d9e7f4;
			border-radius: 8px;
			overflow: hidden;
			background: #ecf0f3;
		}

		.pdf-frame-wrapper iframe {
			width: 100%;
			height: 100%;
			border: 0;
			display: block;
		}

		.pdf-fallback {
			display: none;
			text-align: center;
			padding: 60px 20px;
			color: #6b7c93;
			font-size: 0.95rem;
		}

		.pdf-fallback a { color: #2e86c1; font-weight: 500; }

		footer {
			background-color: white;
			padding: 1px;
			text-align: center;
			color: white;
		}
	</style>
</head>
<body>

<div id="preloader"><p>Please Wait.</p></div>

<!-- Nav (inherits styling from default.css, matches index.html) -->
<div class="nav-wrapper">
	<a href="index.html">
		<div class="dots-wrapper">
			<div id="dot-1" class="browser-dot"></div>
			<div id="dot-2" class="browser-dot"></div>
			<div id="dot-3" class="browser-dot"></div>
		</div>
	</a>
	<ul id="navigation">
		<li><a href="index.html">Home</a></li>
	</ul>
</div>

<div class="pdf-container">
	<div class="pdf-header">
		<div style="flex:1; min-width:240px;">
			<div class="pdf-subtitle">Research Work</div>
			<h4 class="pdf-title" id="pdf-title">Loading…</h4>
		</div>
		<div class="pdf-actions">
			<a id="pdf-download" class="btn btn-primary" href="#" target="_blank" rel="noopener">
				<i class="fa fa-download"></i> Download
			</a>
			<a class="btn btn-primary" href="index.html">
				<i class="fa fa-arrow-left"></i> Back
			</a>
		</div>
	</div>

	<div class="pdf-frame-wrapper">
		<iframe id="pdf-frame" src="" title="PDF viewer"></iframe>
		<div class="pdf-fallback" id="pdf-fallback">
			Your browser cannot display PDFs inline.
			<br><br>
			<a id="pdf-fallback-link" href="#" target="_blank" rel="noopener">Open the PDF in a new tab instead</a>
		</div>
	</div>
</div>

<footer>
	<a href="index.html"><img src="images/tH.png" style="width:100px;height:100px;"></a>
</footer>

<script>
	// Hide preloader
	window.addEventListener('load', function () {
		var loader = document.getElementById('preloader');
		if (loader) loader.style.display = 'none';
	});

	// Read URL params: ?pdf=<path>&title=<title>
	var params  = new URLSearchParams(window.location.search);
	var pdfPath = params.get('pdf');
	var title   = params.get('title') || 'Research Document';

	document.title                             = title + ' – Tariq Hussain';
	document.getElementById('pdf-title').textContent = title;

	if (pdfPath) {
		// Append #toolbar=0 to hide some default browser PDF toolbar chrome
		var pdfSrc = pdfPath + '#toolbar=0&navpanes=0';
		document.getElementById('pdf-frame').src              = pdfSrc;
		document.getElementById('pdf-download').href          = pdfPath;
		document.getElementById('pdf-fallback-link').href     = pdfPath;
	} else {
		document.getElementById('pdf-title').textContent = 'No document specified';
		document.querySelector('.pdf-frame-wrapper').style.display = 'none';
	}
</script>

</body>
</html>
